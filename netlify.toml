[build]
  command = "node scripts/build-public.mjs"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/catalogo"
  to = "/catalogo.html"
  status = 200

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

[[redirects]]
  from = "/api/web-order"
  to = "/.netlify/functions/web-order"
  status = 200

[[redirects]]
  from = "/api/web-order-admin"
  to = "/.netlify/functions/web-order-admin"
  status = 200

[[redirects]]
  from = "/club/:token"
  to = "/club.html?token=:token"
  status = 200


[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://jgjvzqfxakvogaeqfual.supabase.co wss://jgjvzqfxakvogaeqfual.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
